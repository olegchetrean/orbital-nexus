# ============================================================================
#  satelit.megapromoting.com — Orbital Nexus
#  Build static Vite/React (SPA cu react-router), servit direct de nginx.
#  Server: 141.227.180.10 (ssh megapromoting) — nginx 1.26.3
#  Document root: /var/www/satelit
# ----------------------------------------------------------------------------
#  ETAPA 1 (acum): doar HTTP pe portul 80, pentru ca inregistrarea DNS de tip A
#                  pentru "satelit" inca nu exista la Hostinger.
#  ETAPA 2 (dupa ce DNS-ul propaga): se ruleaza
#                  sudo certbot --nginx -d satelit.megapromoting.com
#                  certbot adauga singur blocul 443 + redirectul 80 -> 443.
#                  NU edita manual acest fisier pentru TLS.
#
#  ATENTIE nginx: directivele "add_header" NU se mostenesc intr-un bloc care
#  isi defineste propriile "add_header". De aceea antetele de securitate sunt
#  repetate in fiecare "location" care adauga Cache-Control. Nu le sterge.
# ============================================================================

server {
    listen 80;
    server_name satelit.megapromoting.com;

    root /var/www/satelit;
    index index.html;

    # Site static: nu primim upload-uri.
    client_max_body_size 1M;

    # Nu divulgam versiunea de nginx.
    server_tokens off;

    # --- Compresie -----------------------------------------------------------
    # Imaginile (.jpg de texturi) sunt deja comprimate, nu le includem.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # --- Provocari ACME (Let's Encrypt) --------------------------------------
    # "^~" ca sa castige in fata location-urilor cu expresii regulate de mai jos
    # si ca fallback-ul SPA sa nu inghita token-ul de validare.
    # Functioneaza si cu: certbot certonly --webroot -w /var/www/certbot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
        access_log off;
    }

    # --- Salvare link-uri adanci ---------------------------------------------
    # vite.config.ts foloseste `base: './'`, deci index.html cere `./assets/...`.
    # La un URL cu slash final (ex: /despre/) browserul ar cere /despre/assets/...
    # Rescriem intern spre radacina, ca aplicatia sa porneasca oricum.
    rewrite ^/.+/(assets/.+)$      /$1 last;
    rewrite ^/.+/(favicon\.svg)$   /$1 last;

    # --- index.html: niciodata din cache -------------------------------------
    # Altfel utilizatorii raman blocati pe hash-uri vechi de asset-uri.
    location = /index.html {
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; connect-src 'self' blob: data: https://celestrak.org https://*.celestrak.org https://services.swpc.noaa.gov https://www.swpc.noaa.gov https://ll.thespacedevs.com https://db.satnogs.org https://api.wheretheiss.at" always;
    }

    # --- Asset-uri cu hash in nume: cache maxim ------------------------------
    # Vite pune hash-ul continutului in numele fisierului -> "immutable" e sigur.
    # Include si worker-ul orbital (orbit.worker-*.js) si texturile Pamantului.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
        try_files $uri =404;
    }

    # --- Tipuri MIME care lipsesc din /etc/nginx/mime.types -------------------
    # .mjs (module ES) si .webmanifest nu sunt mapate implicit in nginx 1.26.
    location ~* \.mjs$ {
        default_type text/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # .js si .css servite din afara /assets/ (fara hash) -> cache scurt.
    location ~* \.js$ {
        default_type text/javascript;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.css$ {
        default_type text/css;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Fonturi, iconite, imagini din radacina (ex: favicon.svg).
    location ~* \.(woff2?|ttf|otf|eot|png|jpe?g|webp|gif|ico|svg)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # --- Fallback SPA ---------------------------------------------------------
    # react-router gestioneaza rutele in client; orice URL necunoscut -> index.html.
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; connect-src 'self' blob: data: https://celestrak.org https://*.celestrak.org https://services.swpc.noaa.gov https://www.swpc.noaa.gov https://ll.thespacedevs.com https://db.satnogs.org https://api.wheretheiss.at" always;
    }

    # Fisiere ascunse (.git, .env) — refuzate explicit, mai putin ACME de mai sus.
    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/satelit.access.log;
    error_log  /var/log/nginx/satelit.error.log;
}
